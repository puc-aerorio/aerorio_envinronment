# Configuração do tmux dentro do container (~/.tmux.conf).
# Mouse: clicar troca o painel ativo, arrastar a borda redimensiona, a roda rola o histórico.
set -g mouse on
set -g history-limit 50000
set -g default-terminal "tmux-256color"

# Copiar/colar com o clipboard do sistema (Ctrl+Shift+C / Ctrl+Shift+V do terminal):
#  - arrastar com o mouse (ou selecionar em copy-mode e apertar Enter/y) já manda a seleção
#    para o clipboard via xclip (usa o DISPLAY/X11 que o run.sh repassa ao container);
#  - Ctrl+Shift+V é o "colar" do próprio terminal: ele digita o clipboard no painel ativo;
#  - Ctrl+Shift+C copia a seleção do terminal; com o mouse do tmux ligado, a seleção é do
#    tmux (já copiada pelo xclip). Para selecionar pelo terminal, arraste segurando Shift.
set -s set-clipboard on
bind -T copy-mode    MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -in -selection clipboard >/dev/null 2>&1"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -in -selection clipboard >/dev/null 2>&1"
bind -T copy-mode    Enter send-keys -X copy-pipe-and-cancel "xclip -in -selection clipboard >/dev/null 2>&1"
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "xclip -in -selection clipboard >/dev/null 2>&1"
bind -T copy-mode-vi y     send-keys -X copy-pipe-and-cancel "xclip -in -selection clipboard >/dev/null 2>&1"
# Ctrl+Shift+V cai aqui quando o terminal deixa a combinação passar (terminais com extended-keys).
set -s extended-keys on
bind -n C-S-v run-shell "xclip -out -selection clipboard | tmux load-buffer - && tmux paste-buffer"
# Botão do meio cola o clipboard do sistema.
bind -n MouseDown2Pane run-shell "xclip -out -selection clipboard | tmux load-buffer - && tmux paste-buffer -t '#{pane_id}'"
